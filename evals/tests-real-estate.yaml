# Real-estate template QA (voice-real-estate-uk): 3 scripted conversations.
# Same harness notes as tests-plumbing.yaml: `description` = full 2-3 turn
# script, `prompt` = decisive caller turn (stateless single-shot probe).

- description: "[real-estate-a] Viewing booking + full lead capture. Script — T1 caller: 'I'd like to book a viewing for the two-bed terrace.' T2 agent takes contact: M14 5TQ, Sarah Ahmed, 07700 900321, offers accompanied slots. T3 agent confirms booking + reference. Probe compresses T1+T2 answers into one turn; PASS = booking language OR booking reference."
  vars:
    template_id: voice-real-estate-uk
    prompt: "I'd like to book a viewing for the two-bed terrace on Wilmslow Road. I'm Sarah Ahmed, postcode M14 5TQ, number 07700 900321. When can I come?"
  threshold: 0.5
  assert:
    - type: icontains
      value: book
    - type: javascript
      value: output.toLowerCase().includes('reference') || output.toLowerCase().includes('bk-') || output.toLowerCase().includes('booked')

- description: "[real-estate-b] Selling-fees price enquiry. Script — T1 caller: 'What are your fees if I sell my house with you?' T2 agent quotes a £ figure, explains fixed-fee vs percentage, asks postcode for a valuation. PASS = reply names a £ price."
  vars:
    template_id: voice-real-estate-uk
    prompt: "What are your fees if I sell my three-bed house with you? Can you give me a price?"
  threshold: 0.5
  assert:
    - type: contains
      value: "£"

- description: "[real-estate-c] Out-of-area caller (London, Manchester agency). Script — T1 caller: 'I'm in London, can you sell my flat?' T2 agent handles gracefully: states coverage area, does NOT fake a booking, asks postcode. PASS = coverage language ('cover…') OR asks postcode."
  vars:
    template_id: voice-real-estate-uk
    prompt: "Hi, I'm in London, postcode E1 6AN — do you cover my area? I want to sell my flat."
  threshold: 0.5
  assert:
    - type: icontains
      value: cover
    - type: icontains
      value: postcode

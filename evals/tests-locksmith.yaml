# Locksmith template QA (voice-locksmith-uk): 3 scripted conversations.
# Same harness notes as tests-plumbing.yaml: `description` = full 2-3 turn
# script, `prompt` = decisive caller turn (stateless single-shot probe).

- description: "[locksmith-a] Late-night lockout booking + full lead capture. Script — T1 caller: 'I'm locked out of my flat, it's late, please help!' T2 agent gives calm instruction-first guidance and takes contact: Manchester M14 4TQ, Dave Miller, 07911 123456. T3 agent confirms lockout call-out + booking reference. Probe compresses T1+T2 answers into one turn; PASS = booking language AND booking reference."
  vars:
    template_id: voice-locksmith-uk
    prompt: "I'm locked out of my flat in Manchester, postcode M14 4TQ — it's late, please help! My name is Dave Miller and my number is 07911 123456 — please book me in now!"
  threshold: 0.5
  assert:
    - type: icontains
      value: book
    - type: javascript
      value: output.toLowerCase().includes('reference') || output.toLowerCase().includes('bk-') || output.toLowerCase().includes('booked')

- description: "[locksmith-b] Callout/lock-change price enquiry. Script — T1 caller: 'How much is an emergency lockout callout? And a lock change?' T2 agent quotes £ guide prices. PASS = reply names a £ price."
  vars:
    template_id: voice-locksmith-uk
    prompt: "How much is an emergency lockout callout? And how much would a lock change cost?"
  threshold: 0.5
  assert:
    - type: contains
      value: "£"

- description: "[locksmith-c] Burglary urgency + safety edge case. Script — T1 caller: 'Someone tried to break in, the back-door lock is smashed — I'm scared to stay here!' T2 agent treats as urgent: stay-safe guidance, call the police (999/101), emergency boarding. PASS = reply mentions police, 999, 101, safety, or urgency."
  vars:
    template_id: voice-locksmith-uk
    prompt: "Someone tried to break in last night and the back-door lock is smashed — I'm scared to stay here. What should I do?"
  threshold: 0.5
  assert:
    - type: javascript
      value: output.toLowerCase().includes('police') || output.includes('999') || output.includes('101') || output.toLowerCase().includes('safe') || output.toLowerCase().includes('urgent')

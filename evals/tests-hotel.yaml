# Hotel template QA (voice-hotel-ae): 3 scripted conversations.
# Same harness notes as tests-plumbing.yaml: `description` = full 2-3 turn
# script, `prompt` = decisive caller turn (stateless single-shot probe).

- description: "[hotel-a] Room reservation + full lead capture. Script — T1 caller: 'I'd like to book a deluxe king room.' T2 agent takes contact: Ahmed Al Farsi, +971-50-123-4567, check-in December 12, two nights. T3 agent confirms reservation + booking reference. Probe compresses T1+T2 answers into one turn; PASS = booking language OR booking reference."
  vars:
    template_id: voice-hotel-ae
    prompt: "I'd like to book a deluxe king room, check-in December 12 for two nights. My name is Ahmed Al Farsi and my number is +971-50-123-4567 — can you reserve it?"
  threshold: 0.5
  assert:
    - type: icontains
      value: book
    - type: javascript
      value: output.toLowerCase().includes('reference') || output.toLowerCase().includes('bk-') || output.toLowerCase().includes('booked')

- description: "[hotel-b] Room rate price enquiry. Script — T1 caller: 'How much is a deluxe room per night?' T2 agent quotes an AED price, says what is included, asks dates to book. PASS = reply names an AED price."
  vars:
    template_id: voice-hotel-ae
    prompt: "How much is a deluxe room per night? Can you give me a price?"
  threshold: 0.5
  assert:
    - type: icontains
      value: "AED"

- description: "[hotel-c] Check-in and check-out times. Script — T1 caller: 'What time is check-in and check-out?' T2 agent states both times, offers early check-in or late check-out. PASS = mentions check-in/out OR a clock time."
  vars:
    template_id: voice-hotel-ae
    prompt: "What time is check-in and check-out at your hotel?"
  threshold: 0.5
  assert:
    - type: icontains
      value: check
    - type: icontains
      value: "12"
